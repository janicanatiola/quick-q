<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Queue - Quick-Q</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <h1>Join a Queue</h1>

    <p>Enter your name to join the queue.</p>

    <input type="text" placeholder="Enter your name">

    <br><br>

  <button onclick="joinQueue()">Join Queue</button>

  <script>
    function joinQueue() {
    let nextNumber = localStorage.getItem("nextQueueNumber");

    if (nextNumber === null) {
        nextNumber = 1;
    } else {
        nextNumber = Number(nextNumber);
    }

    let queueNumber = nextNumber;

    localStorage.setItem("nextQueueNumber", nextNumber + 1);

    sessionStorage.setItem("myQueueNumber", queueNumber);

    let activeQueue = JSON.parse(localStorage.getItem("activeQueue")) || [];

    activeQueue.push(queueNumber);

    localStorage.setItem("activeQueue", JSON.stringify(activeQueue));

    if (localStorage.getItem("currentlyServing") === null) {
        localStorage.setItem("currentlyServing", queueNumber);
    }

    window.location.href = "queue.html";
}
  </script>

</body>
</html>
