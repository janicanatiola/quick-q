<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Queue - Quick-Q</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <h1>Your Queue Number</h1>

    <p>You have successfully joined the queue!</p>

    <h2 id="queueNumber">#1</h2>

    <p id="peopleAhead">People ahead of you: 0</p>

    <p>Currently being served: #1</p>

    <br>

    <button onclick="cancelQueue()">Cancel Queue</button>

<script>
    let queueNumber = sessionStorage.getItem("myQueueNumber");

let currentlyServing = localStorage.getItem("currentlyServing");

if (currentlyServing === null) {
    currentlyServing = 1;
}

document.getElementById("queueNumber").textContent = "#" + queueNumber;

let peopleAhead = Number(queueNumber) - currentlyServing;

if (peopleAhead < 0) {
    peopleAhead = 0;
}

document.getElementById("peopleAhead").textContent =
    "People ahead of you: " + peopleAhead;

    function cancelQueue() {
    localStorage.removeItem("queueNumber");
    window.location.href = "index.html";
}
</script>

</body>
</html>
