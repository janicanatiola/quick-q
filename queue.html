<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Queue - Quick-Q</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <h1>Your Queue Number</h1>

    <p>You have successfully joined the queue!</p>

    <h2 id="queueNumber">#1</h2>

    <p id="peopleAhead">People ahead of you: 0</p>

    <p id="currentlyServing">Currently being served: #1</p>

    <br>

    <button onclick="cancelQueue()">Cancel Queue</button>

    <button onclick="resetQueue()">Reset Test Queue</button>

<script>
    let queueNumber = sessionStorage.getItem("myQueueNumber");

let currentlyServing = localStorage.getItem("currentlyServing");

if (currentlyServing === null) {
    currentlyServing = 1;
}

document.getElementById("currentlyServing").textContent =
    "Currently being served: #" + currentlyServing;

document.getElementById("queueNumber").textContent = "#" + queueNumber;

let activeQueue = JSON.parse(localStorage.getItem("activeQueue")) || [];

let peopleAhead = activeQueue.filter(number =>
    Number(number) < Number(queueNumber) &&
    Number(number) >= Number(currentlyServing)
).length;

document.getElementById("peopleAhead").textContent =
    "People ahead of you: " + peopleAhead;

    function updateQueue() {
    let currentServing = Number(localStorage.getItem("currentlyServing")) || 1;

    let updatedQueue = JSON.parse(localStorage.getItem("activeQueue")) || [];

    let updatedPeopleAhead = updatedQueue.filter(number =>
        Number(number) < Number(queueNumber) &&
        Number(number) >= currentServing
    ).length;

    document.getElementById("peopleAhead").textContent =
        "People ahead of you: " + updatedPeopleAhead;

    document.getElementById("currentlyServing").textContent =
        "Currently being served: #" + currentServing;
}

setInterval(updateQueue, 1000);

    function cancelQueue() {
    let myNumber = Number(sessionStorage.getItem("myQueueNumber"));

    let activeQueue = JSON.parse(localStorage.getItem("activeQueue")) || [];

    activeQueue = activeQueue.filter(number => number !== myNumber);

    localStorage.setItem("activeQueue", JSON.stringify(activeQueue));

    let currentlyServing = Number(localStorage.getItem("currentlyServing"));

    if (myNumber === currentlyServing && activeQueue.length > 0) {
        localStorage.setItem("currentlyServing", activeQueue[0]);
    }

    sessionStorage.removeItem("myQueueNumber");

    window.location.href = "index.html";
}

function resetQueue() {
    localStorage.removeItem("activeQueue");
    localStorage.removeItem("nextQueueNumber");
    localStorage.removeItem("currentlyServing");
    sessionStorage.removeItem("myQueueNumber");

    window.location.href = "index.html";
}

</script>

</body>
</html>
